# High-Performance Order Matching Engine Configuration

# ----------------------------------------------------
# LMAX Disruptor Configuration
# ----------------------------------------------------
# Ring Buffer Size (Must be a power of 2)
disruptor.ringbuffer.size=65536

# Wait Strategy for consumers
# Options: BUSY_SPIN (lowest latency, high CPU), YIELDING (low latency, balanced CPU), BLOCKING (higher latency, lowest CPU)
disruptor.wait.strategy=YIELDING

# Thread pool configuration (Virtual Threads are used, so thread pools are lightweight)
disruptor.use.virtual.threads=true

# ----------------------------------------------------
# Order Book Configuration
# ----------------------------------------------------
# Supported symbol list (comma-separated)
engine.supported.symbols=BTCUSDT,ETHUSDT,SOLUSDT

# ----------------------------------------------------
# Object Pool (GC-Free Memory) Configuration
# ----------------------------------------------------
# Maximum size of pre-allocated order objects in the pool
pool.orders.max.capacity=100000

# Maximum size of pre-allocated trade objects in the pool
pool.trades.max.capacity=100000

# Pre-fill pools on startup (true/false)
pool.prefill.enabled=true
