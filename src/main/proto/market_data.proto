syntax = "proto3";

package com.exchange.matching.protobuf;

option java_multiple_files = true;
option java_package = "com.exchange.matching.protobuf";

/**
 * Protocol Buffer payload for an individual price level in order book depth.
 */
message PriceLevelProto {
  double price = 1;
  double quantity = 2;
  int32 order_count = 3;
}

/**
 * Protocol Buffer payload for Market Data depth and ticker updates.
 */
message MarketDataProto {
  string symbol = 1;
  int64 timestamp = 2;
  repeated PriceLevelProto bids = 3;
  repeated PriceLevelProto asks = 4;
  double last_price = 5;
  double volume_24h = 6;
}
